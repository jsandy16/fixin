name: renew-token

# Keep the Dhan access token alive without manual rotation. Every ~12h, renew
# the active token (Dhan RenewToken extends it 24h) and store it in R2, then
# tell the dashboard to reload it. Runs twice a day for margin against GitHub
# cron drift. If the chain ever breaks (down > 24h), seed a fresh token once.
on:
  schedule:
    - cron: "0 2,14 * * *"   # 07:30 & 19:30 IST
  workflow_dispatch: {}

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests boto3
      - name: Renew token -> R2
        run: python renew_token.py
      - name: Tell the dashboard to reload the token
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          curl -s --max-time 120 -X POST https://mrv5-dashboard.onrender.com/api/reload \
            -H "Authorization: Bearer $INGEST_TOKEN"; echo
