name: keepalive

# Render's free tier spins the service down after 15 min idle. Ping /health
# every 5 min to keep it warm (avoids the ~50s cold start for visitors).
# Note: GitHub Actions cron is best-effort and can drift 5-15 min under load;
# for a hard guarantee use an external pinger (cron-job.org / UptimeRobot).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s --max-time 120 -o /dev/null -w "%{http_code}" \
            https://mrv5-dashboard.onrender.com/health)
          echo "health HTTP $code"
          test "$code" = "200"
