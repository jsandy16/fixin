name: eod-refresh

# Nightly EOD refresh. Runs the HEAVY job here (GitHub runners have ~7GB RAM) —
# NOT on the 512Mi free Render instance, which OOMs on the pandas workload.
# Flow: pull DB from R2 -> ingest settled bars -> compute plan -> push to R2 ->
# tell the web service to reload. eod = plan only, never places orders.
on:
  schedule:
    - cron: "10 10 * * 1-5"   # 10:10 UTC = 15:40 IST, Mon-Fri
  workflow_dispatch: {}        # allow manual runs from the Actions tab

jobs:
  eod:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      MRV5_EQUITY: ${{ secrets.MRV5_EQUITY }}
      MRV5_MAX_ORDER: ${{ secrets.MRV5_MAX_ORDER }}
      MRV5_MAX_ORDERS: ${{ secrets.MRV5_MAX_ORDERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Pull current DB from R2
        run: python -m live.r2sync download
      - name: Ingest settled bars (falls back to free mirror if Dhan fails)
        run: python -m live.ingest --mode daily || python -m live.ingest --mode daily --source mirror
      - name: Compute EOD plan (no orders)
        run: python -m live.trader --mode eod || true
      - name: Push refreshed DB to R2
        run: python -m live.r2sync upload
      - name: Tell the web service to reload from R2
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          DASH_URL: https://mrv5-dashboard.onrender.com
        run: |
          code=$(curl -s --max-time 180 -o /tmp/r -w "%{http_code}" \
            -X POST "$DASH_URL/api/reload" \
            -H "Authorization: Bearer $INGEST_TOKEN")
          echo "reload HTTP $code"; cat /tmp/r; echo
          test "$code" = "200"
