name: eod-scan

# 15:14 IST daily scan. Ingest the latest bars, compute the plan (new entry
# signals + exit signals) and persist it (into live.db -> R2), then reload the
# dashboard so the Positions tab shows today's new entry signals.
# Heavy pandas job — runs on the GitHub runner (~7GB), NOT the 512Mi free web
# instance. Entries from this plan are taken the next morning by paper-open.yml.
# NOTE: at 15:14 IST the settled daily bar is not final yet, so we try Dhan
# provisional (intraday) first and fall back to the settled mirror bar.
on:
  schedule:
    - cron: "44 9 * * 1-5"   # 09:44 UTC = 15:14 IST, Mon-Fri
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      MRV5_EQUITY: ${{ secrets.MRV5_EQUITY }}
      MRV5_MAX_ORDER: ${{ secrets.MRV5_MAX_ORDER }}
      MRV5_MAX_ORDERS: ${{ secrets.MRV5_MAX_ORDERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pull current DB from R2
        run: python -m live.r2sync download
      - name: Ingest latest bars (Dhan provisional -> settled mirror fallback)
        run: |
          python -m live.ingest --mode daily --provisional \
            || python -m live.ingest --mode daily --source mirror \
            || echo "ingest could not fetch fresh bars; scanning on latest available"
      - name: Compute + persist the plan (entries/exits)
        run: python -m live.trader --mode eod --allow-stale
      - name: Push DB + plan to R2
        run: python -m live.r2sync upload
      - name: Reload the dashboard (show new signals)
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          DASH_URL: https://mrv5-dashboard.onrender.com
        run: |
          code=$(curl -s --max-time 180 -o /tmp/r -w "%{http_code}" \
            -X POST "$DASH_URL/api/reload" -H "Authorization: Bearer $INGEST_TOKEN")
          echo "reload HTTP $code"; cat /tmp/r; echo
          test "$code" = "200"
